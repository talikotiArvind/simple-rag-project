name: Python Code Checks

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ruff/mypy come from requirements.txt so versions match what agents run locally.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve diff range against PR base
        id: diff
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"

      # Blocking: only changed .py files must be clean (diff-scoped gate).
      - name: Ruff on changed files (blocking)
        run: |
          CHANGED=$(git diff --name-only "${{ steps.diff.outputs.base }}" HEAD -- '*.py' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No changed Python files."
          else
            ruff check $CHANGED
          fi

      # --follow-imports=silent keeps this diff-scoped for real: without it, mypy
      # walks into every module a changed file imports and reports pre-existing
      # errors there too, defeating the point of scoping to the diff.
      # Test files are excluded from --strict; ruff still lints them. The pattern
      # matches a `test`/`tests` segment anywhere so nested suites are excluded too.
      - name: Mypy on changed files (blocking)
        run: |
          CHANGED=$(git diff --name-only "${{ steps.diff.outputs.base }}" HEAD -- '*.py' | grep -v -E '(^|/)(test|tests)/' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "No changed non-test Python files."
          else
            mypy $CHANGED --strict --ignore-missing-imports --follow-imports=silent --no-error-summary
          fi

      # Informational only: surfaces full-repo debt trend without blocking merges
      # on violations this PR didn't introduce.
      - name: Ruff full-repo scan (informational)
        continue-on-error: true
        run: ruff check . --statistics

      - name: Mypy full-repo scan (informational)
        continue-on-error: true
        run: mypy src --ignore-missing-imports --no-error-summary
